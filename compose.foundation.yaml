# Separate project: docker compose -p operator-foundation -f compose.foundation.yaml ...
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: operator
      POSTGRES_USER: operator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password}
    volumes: ["foundation_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operator -d operator"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: Dockerfile.foundation
    env_file: .env.foundation
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["127.0.0.1:8090:8090"]
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    pids_limit: 128
    restart: unless-stopped
volumes:
  foundation_db:
